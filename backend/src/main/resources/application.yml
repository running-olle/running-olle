spring:
  application:
    name: running-olle
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  profiles:
    include: secret
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:uploads}
    public-base-path: ${APP_STORAGE_PUBLIC_BASE_PATH:/uploads}

tourism:
  sync:
    area-code: ${TOURISM_SYNC_AREA_CODE:39}
    content-type-ids: ${TOURISM_SYNC_CONTENT_TYPE_IDS:12,14,28}
    page-size: ${TOURISM_SYNC_PAGE_SIZE:100}
    bootstrap-enabled: ${TOURISM_SYNC_BOOTSTRAP_ENABLED:true}
    scheduler-enabled: ${TOURISM_SYNC_SCHEDULER_ENABLED:true}
    cron: "${TOURISM_SYNC_CRON:0 0 4 ? * MON}"
    zone: ${TOURISM_SYNC_ZONE:Asia/Seoul}
  event-sync:
    area-code: ${TOURISM_EVENT_SYNC_AREA_CODE:39}
    page-size: ${TOURISM_EVENT_SYNC_PAGE_SIZE:100}
    look-back-days: ${TOURISM_EVENT_SYNC_LOOK_BACK_DAYS:30}
    look-ahead-days: ${TOURISM_EVENT_SYNC_LOOK_AHEAD_DAYS:365}
    bootstrap-enabled: ${TOURISM_EVENT_SYNC_BOOTSTRAP_ENABLED:true}
    scheduler-enabled: ${TOURISM_EVENT_SYNC_SCHEDULER_ENABLED:true}
    cron: "${TOURISM_EVENT_SYNC_CRON:0 20 4 ? * MON}"
    zone: ${TOURISM_EVENT_SYNC_ZONE:Asia/Seoul}
    running-keywords: ${TOURISM_EVENT_SYNC_RUNNING_KEYWORDS:마라톤,러닝,런,트레일런,트레일,레이스,달리기,걷기,워킹}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:off}
    org.springframework.security: info

external-api:
  kakao-map-api-key: ${EXTERNAL_API_KAKAO_MAP_API_KEY}
  tour-api-key: ${EXTERNAL_API_TOUR_API_KEY}
  open-route-service-key: ${EXTERNAL_API_OPEN_ROUTE_SERVICE_KEY}
  tour-mobile-os: ${EXTERNAL_API_TOUR_MOBILE_OS}
  tour-mobile-app: ${EXTERNAL_API_TOUR_MOBILE_APP}
