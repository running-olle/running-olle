spring:
  application:
    name: running-olle
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  profiles:
    include: secret
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:uploads}
    public-base-path: ${APP_STORAGE_PUBLIC_BASE_PATH:/uploads}

tourism:
  sync:
    area-code: "39"
    content-type-ids: [ "12", "14", "28" ]
    page-size: 100
    scheduler-enabled: false
    manual-sync-enabled: false
    cron: "0 0 4 * * *"
    zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:off}
    org.springframework.security: info
