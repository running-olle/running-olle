spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_name
    username: user_name
    password: password
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: YOUR_KAKAO_REST_API_KEY
            client-secret: YOUR_KAKAO_CLIENT_SECRET

jwt:
  secret: AT_LEAST_32_BYTE_RANDOM_SECRET
  expiration: 86400000

tourism:
  sync:
    # When true, app startup backfills Jeju TourAPI places only if tourism_places is empty.
    bootstrap-enabled: true
    # Enabled by default in application.yml. Set false only when scheduled TourAPI refresh should be disabled.
    scheduler-enabled: true
    # Example: weekly Monday 04:00 in Asia/Seoul.
    cron: "0 0 4 ? * MON"
  event-sync:
    # When true, app startup backfills Jeju TourAPI events only if tourism_events is empty.
    bootstrap-enabled: true
    # Enabled by default in application.yml. Set false only when scheduled TourAPI event refresh should be disabled.
    scheduler-enabled: true
    # Example: weekly Monday 04:20 in Asia/Seoul.
    cron: "0 20 4 ? * MON"
    # Used to decide whether a TourAPI festival/event is running-related.
    running-keywords: 마라톤,러닝,런,트레일런,트레일,레이스,달리기,걷기,워킹

external-api:
  # Kakao Local keyword search REST API key. The Kakao JavaScript map key for frontend lives in frontend/.env.local.
  kakao-map-api-key: YOUR_KAKAO_REST_API_KEY
  tour-api-key: YOUR_TOUR_API_SERVICE_KEY
  open-route-service-key: YOUR_OPEN_ROUTE_SERVICE_API_KEY
  tour-mobile-os: ETC
  tour-mobile-app: RunningOlle

app:
  storage:
    local-dir: uploads
    public-base-path: /uploads
