spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_name
    username: user_name
    password: password
  ai:
    openai:
      api-key: YOUR_OPENAI_API_KEY
    vectorstore:
      pgvector:
        # Requires the local Postgres image from infra/postgres with pgvector installed.
        # Keep false unless you are actively testing RAG.
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: YOUR_KAKAO_REST_API_KEY
            client-secret: YOUR_KAKAO_CLIENT_SECRET

jwt:
  secret: AT_LEAST_32_BYTE_RANDOM_SECRET
  expiration: 86400000

tourism:
  sync:
    # Local/development only. Keep false in production unless the endpoint is protected separately.
    manual-sync-enabled: false

external-api:
  # Kakao Local keyword search REST API key. The Kakao JavaScript map key for frontend lives in frontend/.env.local.
  kakao-map-api-key: YOUR_KAKAO_REST_API_KEY
  tour-api-key: YOUR_TOUR_API_SERVICE_KEY
  open-route-service-key: YOUR_OPEN_ROUTE_SERVICE_API_KEY
  tour-mobile-os: ETC
  tour-mobile-app: RunningOlle

home:
  recommendation:
    manual-sync-enabled: false
    # Allows document embedding sync jobs to write to pgvector.
    # This can be true while rag.enabled stays false, so data can be prepared before RAG is exposed.
    embedding-sync-enabled: false
    # false: base recommendation only
    # true: rerank top candidates with AI, then fall back to base recommendation on any AI failure
    # To actually enable the OpenAI chat model, also override spring.ai.model.chat=openai in a local secret config.
    ai-enabled: false
    # Number of base-score candidates passed to AI reranking
    rerank-candidate-limit: 5
    # finalScore = baseScore * base-score-weight + ragScore * rag-score-weight
    base-score-weight: 0.75
    rag-score-weight: 0.25
    ai:
      # Phase 3: current AI path only reranks the already-selected top candidates.
      rerank-enabled: true
      provider: openai
      request-timeout-ms: 5000
    rag:
      # Enables pgvector-backed context retrieval for the already-selected top base candidates.
      enabled: false
      vector-store: pgvector
      metadata-filter-required: true
      candidate-document-limit: 5
    sync:
      # Runs recommendation document and embedding sync on a schedule.
      scheduler-enabled: false
      cron: "0 0 4 * * *"
      zone: Asia/Seoul

app:
  storage:
    local-dir: uploads
    public-base-path: /uploads
