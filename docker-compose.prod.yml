services:
  backend:
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:latest
    container_name: running_olle_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:latest
    container_name: running_olle_frontend
    restart: unless-stopped
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: running_olle_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.2.1
    container_name: running_olle_grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://monitor.running-olle.site
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  caddy:
    image: caddy:2-alpine
    container_name: running_olle_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - grafana

volumes:
  uploads:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
